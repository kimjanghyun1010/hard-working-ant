---
layout: default
title: 태그
permalink: /tags/
---
<div class="page">
  <h1 class="post-title">태그</h1>
  {%- assign tags = site.tags | sort %}
  {%- for tag in tags %}
  <section id="{{ tag[0] | slugify }}">
    <h2 class="list-head">{{ tag[0] }} <span>{{ tag[1].size }}</span></h2>
    <ul class="post-list">
      {%- for p in tag[1] %}
      {% include post-item.html post=p %}
      {%- endfor %}
    </ul>
  </section>
  {%- endfor %}
</div>
